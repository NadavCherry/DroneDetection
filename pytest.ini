[pytest]
# This machine has ROS 2 Jazzy on the interpreter path, and ROS ships pytest
# plugins (launch_ros, launch_testing, the ament linters) as entry points. They
# are auto-loaded into every pytest run in this venv, and `launch_testing`
# imports `lark`, which is not installed -- so collecting a test file that has
# nothing to do with ROS dies during plugin startup with a ModuleNotFoundError
# pointing at /opt/ros. Disabling them by name here fixes it for everyone
# without needing PYTEST_DISABLE_PLUGIN_AUTOLOAD in the environment.
addopts = -p no:launch_ros -p no:launch_testing -p no:ament_flake8 -p no:ament_pep257 -p no:ament_lint -p no:ament_copyright -p no:ament_xmllint
testpaths = pursuit/tests
